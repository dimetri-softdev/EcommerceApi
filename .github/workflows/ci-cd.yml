name: Ecommerce API CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore EcommerceApi.slnx
      - name: Test
        run: dotnet test EcommerceApi.slnx --configuration Release --no-restore
      - name: Publish API
        run: dotnet publish StoreApi.csproj --configuration Release --no-restore --output ./publish
      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecommerce-api
          path: ./publish
          if-no-files-found: error

  deployment-settings:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        name: Check Azure deployment configuration
        shell: bash
        env:
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if [[ -n "$AZURE_WEBAPP_NAME" && -n "$AZURE_WEBAPP_PUBLISH_PROFILE" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Azure deployment skipped; configure AZURE_WEBAPP_NAME and AZURE_WEBAPP_PUBLISH_PROFILE."
          fi

  deploy:
    needs: [build-and-test, deployment-settings]
    if: needs.deployment-settings.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ecommerce-api
          path: ./publish
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
